on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Haciendo el ejercicio entregable..."
        required: true
        default: "Hola desde GitHub Actions"
        type: string

jobs:
  imprimir:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mensaje
        env:
          MENSAJE: ${{ inputs.mensaje }}
        run: echo "$MENSAJE"